name: Build NDS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          dkp-pacman -Sy --noconfirm nds-dev nds-examples
          T=$(find /opt/devkitpro/examples/nds -type d -name hello_world | head -1)
          mkdir -p /tmp/proj
          cp -r "$T"/. /tmp/proj/
          rm -rf /tmp/proj/source/*
          cp main.c /tmp/proj/source/main.c
          cd /tmp/proj && make
          cp /tmp/proj/*.nds "$GITHUB_WORKSPACE/minish_quest.nds"
      - uses: actions/upload-artifact@v4
        with:
          name: minish_quest
          path: minish_quest.nds
