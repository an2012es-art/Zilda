# ضعه في المستودع باسم:  .github/workflows/build.yml
# ويجب أن يكون main.c في جذر المستودع بجانبه.
name: Build NDS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITARM=${DEVKITARM:-$DEVKITPRO/devkitARM}
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          [ -d "$DEVKITPRO/libnds" ] || dkp-pacman -S --noconfirm nds-dev
          ARCH="-march=armv5te -mtune=arm946e-s -mthumb -mthumb-interwork"
          arm-none-eabi-gcc -O2 -Wall -ffast-math -fomit-frame-pointer $ARCH -I$DEVKITPRO/libnds/include -DARM9 main.c -specs=ds_arm9.specs -g $ARCH -L$DEVKITPRO/libnds/lib -lnds9 -o citydrive.elf
          ndstool -c citydrive.nds -9 citydrive.elf
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: citydrive-nds
          path: citydrive.nds
